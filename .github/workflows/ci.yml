name: CI

on:
  push:
    branches: [main, rebuild-v2]
  pull_request:

# Cancel in-flight runs on the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Static checks ──────────────────────────────────────────────────
  # No DB required. Runs on every push + PR.
  static:
    name: lint · typecheck · build · pglite migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Validate migrations (pglite)
        working-directory: web
        run: pnpm validate:migrations

      - name: Build
        working-directory: web
        # Build needs NEXT_PUBLIC_SUPABASE_URL for next.config.ts fail-fast.
        # The build never calls Supabase; it just parses the hostname for
        # images.remotePatterns. A stub URL is fine.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: pnpm build

  # ─── Integration tests ──────────────────────────────────────────────
  # vitest data-layer/auth suites + launch-blockers run against a LOCAL
  # Supabase stack booted in the runner — NEVER production. No secrets,
  # no prod writes. This is the prod-data-safety contract: every suite
  # that INSERTs/DELETEs fixtures targets the throwaway local DB.
  integration:
    name: integration (vitest + launch-blockers · local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: web
        run: supabase start

      - name: Apply migrations + seed
        working-directory: web
        run: supabase db reset

      - name: Write local test env
        working-directory: web
        # write-test-env.mjs writes .env.test (vitest) + e2e/.env.e2e.
        # launch-blockers reads .env.local, so mirror the local creds there.
        run: |
          node scripts/write-test-env.mjs
          cp .env.test .env.local

      - name: Integration tests (vitest)
        working-directory: web
        run: pnpm test

      - name: Launch-blockers (against local stack)
        working-directory: web
        run: pnpm launch-blockers

      - name: Stop local Supabase
        if: always()
        working-directory: web
        run: supabase stop --no-backup || true

  # ─── End-to-end (Playwright) ─────────────────────────────────────────
  # Drives the REAL admin UI (login → TOTP 2FA → /admin → edit) against a
  # local Supabase stack + a production build of the app. Local only.
  e2e:
    name: e2e (Playwright · local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: web
        run: supabase start

      - name: Apply migrations + seed
        working-directory: web
        run: supabase db reset

      - name: Write local e2e env
        working-directory: web
        run: node scripts/write-test-env.mjs

      - name: Seed TOTP admin
        working-directory: web
        run: pnpm e2e:seed

      - name: Install Playwright chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        working-directory: web
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        working-directory: web
        run: supabase stop --no-backup || true

# NOTE: there is intentionally NO job that runs fixture-creating tests
# against the production Supabase project. The old `live` job (vitest +
# launch-blockers vs prod) was removed — it wrote `zzz-` fixtures to prod
# on every push. Production is touched ONLY by the read-only nightly
# backup (.github/workflows/backup.yml) and by deliberate, manual deploys.
# Run `pnpm launch-blockers` against prod by hand at deploy time.
